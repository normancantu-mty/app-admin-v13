# Plantilla del LOTE (Cazador F0, WP-7a). Escrito el 2026-10-17 por el ejecutor B del Socio.
# Lote v2 (2026-10-19, ejecutor del Socio): codigo L-DD-MM.N, Brix, aditivo 1,
# confirmacion con fecha, y el CICLO (aditivo 2, reposo, destilacion, muestra).
#
# Esto es DATOS, no codigo: `bot/lote_plantilla.py` y `bot/lote_ciclo.py` la
# leen al arrancar. Para agregar una pregunta, cambiar un rango, un dia del
# ciclo o una forma de decirlo, se edita aqui y se reinicia el bot. Las
# expresiones son regex de Python, sobre el texto en minusculas y SIN acentos.
#
# Reglas que la plantilla respeta (D de Norman 2026-10-17):
#   - preguntas en tandas de <=4, numeradas;
#   - se aceptan varias respuestas en un mensaje (sueltas o "1. 40  2. 8");
#   - un rango fuera de lo normal AVISA, nunca bloquea;
#   - lo que no tiene campo (tipo de chile, observacion) va a `notas` del lote;
#   - al final de CADA etapa, un mensaje con todo + la fecha de hoy y botones
#     Confirmar / Corregir. Nada se guarda antes de Confirmar.

nombre: lote
vida_minutos: 30

# El codigo del lote. {dd} dia, {mm} mes, {aaaa} anio, {aa} anio corto, {n} el
# consecutivo del dia (1 + el mayor N que ya exista con el mismo prefijo).
# OJO: sin anio, L-19-10.1 se repite el 19 de octubre del anio que entra y
# `lotes.codigo_lote` es UNIQUE: ese dia saldria L-19-10.2 (o el que siga).
formato_codigo: 'L-{dd}-{mm}.{n}'

# Los aditivos van por SKU OPACO (ERP-84): nunca por su nombre real.
# Decidido por Norman el 2026-10-19 (plan v3 §8): aditivo 1 = ing-az, aditivo 2 = ing-al.
# Fase 7 (2026-11-07): 'ing-az'/'ing-al' NO existen en el catalogo de produccion
# (SELECT del 2026-11-07: los SKU son 'mosto-1' = "Aditivo 1" y 'aditivo-2' =
# "Aditivo 2"); con ellos el aditivo 1 del dia de produccion no se resolvia y la
# etapa del aditivo 2 respondia "No encontre el insumo". Se apunta a los reales.
aditivo_1_sku: 'mosto-1'
aditivo_2_sku: 'aditivo-2'
# 2026-11-10 (Cris, D-004): la levadura y enzimas entra en la pregunta del aditivo 1.
# 2026-11-10 (Norman): aditivo 1, aditivo 2 y levadura se llevan en GRAMOS en el
# ERP. Lo dicho en gramos pasa directo; lo dicho en kilos se pasa a gramos; un
# numero sin unidad se pregunta ("8 gramos o 8 kilos?").
levadura_sku: 'levadura-enzimas'

# Frases que ABREN la plantilla sin pasar por el modelo. Se buscan al inicio
# del mensaje (o "plantilla" en cualquier parte).
disparadores:
  - '^\W*(hoy\s+|ya\s+)?(empezamos|empecemos|empezemos|iniciemos|arranquemos|arrancamos|arranque|arranco|iniciamos|abrimos|abro)\s+(un\s+|el\s+|otro\s+|con\s+(un\s+|el\s+|otro\s+)?)?lote'
  - '^\W*(hoy\s+|ya\s+)?(empecemos|empezemos|iniciemos|arranquemos)\W*$'
  - '^\W*(hoy\s+)?lote\s+nuevo'
  - 'plantilla\s+(del?\s+)?lote'

intro: 'Lote nuevo. Contestame lo que sepas, todo en un mensaje si quieres:'
cierre: 'El codigo lo pongo yo si no me lo dices. Las observaciones las anoto en notas del lote.'

# Cada pregunta numerada de la plantilla (maximo 4). Una pregunta puede pedir
# mas de un campo ("Kilos de chile y tipo de chile").
# 2026-11-10 (Norman, "Al abrir + etapas"): la fecha de inicio entra al
# formulario; el Brix final sale a la segunda tanda (`despues`), con el fin de
# la fermentacion y las horas como opcionales.
preguntas:
  - etiqueta: 'Fecha de inicio (si no me dices, es hoy)'
    campos: [fecha_inicio]
  - etiqueta: 'Kilos de chile y tipo de chile'
    campos: [kg_chile, tipo_chile]
  - etiqueta: 'Brix chile'
    campos: [brix_chile]
  - etiqueta: 'Aditivo 1 y levadura y enzimas, con su unidad (ej. "8 kg y 20 g")'
    campos: [aditivo_1, g_levadura]

# La segunda tanda: se pregunta despues del formulario, con lo que falte. Los
# `opcional` se preguntan UNA vez y solo junto con algo que falte (nunca solos:
# al abrir el lote casi nunca ha terminado la fermentacion, y para eso esta la
# etapa "termino la fermentacion"). Tambien salen en "Corregir".
despues:
  - etiqueta: 'Brix final'
    campos: [brix_final]
  - etiqueta: '(opcional) Si ya termino la fermentacion: cuando termino y cuantas horas fermento'
    campos: [fin_fermentacion, horas_fermentacion]
    opcional: true

campos:
  # 2026-11-10: la fecha de inicio. Si no la dicen, es hoy. 'ayer', 'antier',
  # 'hace 2 dias', '8/11', 'el 8 de noviembre'. Con otra fecha que no sea hoy,
  # el codigo del lote lo pone el servidor con ESA fecha (L-DD-MM.N).
  - nombre: fecha_inicio
    etiqueta: 'Fecha de inicio'
    pregunta: 'Que dia empezo el lote? (hoy, ayer, 8/11)'
    obligatorio: false
    tipo: fecha
    patrones:
      - '\b(?:empez\w*|empec\w*|arranc\w*|inici\w*|abri\w*|inicio)\b[^.,;0-9]{0,25}?((?:el\s+)?\d{1,2}\s+de\s+[a-z]+|\d{1,2}/\d{1,2}(?:/\d{2,4})?|\d{4}-\d{1,2}-\d{1,2}|antier|antes\s+de\s+ayer|ayer|hoy|hace\s+\d{1,2}\s+dias?)'
      - '\bfecha\s+(?:de\s+)?inicio\s*(?:es|:|el)?\s*((?:el\s+)?\d{1,2}\s+de\s+[a-z]+|\d{1,2}/\d{1,2}(?:/\d{2,4})?|\d{4}-\d{1,2}-\d{1,2}|antier|ayer|hoy|hace\s+\d{1,2}\s+dias?)'
  - nombre: kg_chile
    etiqueta: 'Kilos de chile'
    pregunta: 'Cuantos kilos de chile entraron?'
    obligatorio: true
    tipo: numero
    unidad: kg
    # `insumo`: de que insumo es la cantidad. Su `unidad` DEBE ser la del
    # catalogo de ese SKU (tests/bot-plantilla-unidades.spec.ts). 'chiles' = los
    # SKU de `chiles.conocidos`.
    insumo: chiles
    rango: [1, 1000]
    patrones:
      - '(\d+(?:[.,]\d+)?)\s*(?:kilos?|kgs?|kilogramos?)\s+de\s+chile'
      - '(\d+(?:[.,]\d+)?)\s*(?:kilos?|kgs?|kilogramos?)\b(?!\s+(?:de\s+)?(?:aditivo|levadura|enzimas?))'
  - nombre: tipo_chile
    etiqueta: 'Tipo de chile'
    pregunta: 'Que chile es?'
    obligatorio: false
    tipo: texto
    a_notas: 'tipo de chile'
    patrones:
      - '\b(jalapeno|guajillo|guajon|habanero|serrano|chipotle|piquin|morita|ancho|pasilla|de arbol|poblano|manzano)\b'
  - nombre: brix_chile
    etiqueta: 'Brix chile'
    pregunta: 'Cuanto Brix dio el chile?'
    obligatorio: true
    tipo: numero
    unidad: Brix
    rango: [0, 40]
    patrones:
      - 'brix\s+(?:del?\s+)?chile\s*(?:de|en|a|:)?\s*(\d+(?:[.,]\d+)?)'
      - 'chile\s+(?:en|a|con|de)\s+(\d+(?:[.,]\d+)?)\s*(?:de\s+)?brix'
  # 2026-11-10 (Norman: "aditivo 1 y aditivo 2 mejor si los registre como
  # gramos en el erp, pero que el bot los interprete"): el aditivo 1 se guarda
  # en GRAMOS (el catalogo). "8000 g" pasa directo; "8 kg" se pasa a 8000 g; un
  # numero sin unidad se pregunta (`pedir_unidad`). La receta es ~8 kg (8000 g)
  # por lote; el rango solo AVISA (atrapa un "8 gramos" que eran kilos).
  - nombre: aditivo_1
    etiqueta: 'Aditivo 1'
    pregunta: 'Cuanto aditivo 1, con su unidad? (ej. "8 kg" u "8000 g")'
    obligatorio: true
    tipo: numero
    unidad: g
    pedir_unidad: true
    clave: 'aditivo(?:\s*1\b|\s+uno\b)?'
    insumo: aditivo_1_sku
    rango: [500, 50000]
    patrones:
      - '(\d+(?:[.,]\d+)?)\s*(?:kilos?|kgs?|kilogramos?|g|gr|grs|gramos?)\s+(?:de\s+)?aditivo(?:\s*1\b|\s+uno\b)?'
      - 'aditivo(?:\s*1\b|\s+uno\b)?\s*(?:de|:)?\s*(\d+(?:[.,]\d+)?)\s*(?:kilos?|kgs?|kilogramos?|g|gr|grs|gramos?)\b'
  # D-004 (Cris, 2026-11-10): segunda cantidad de la pregunta del aditivo 1
  # ("4. 8 kg 20 g"). 2026-11-10 (Norman): en GRAMOS, como el aditivo; un numero
  # sin unidad se pregunta. Receta ~20 g por lote; el rango solo AVISA.
  - nombre: g_levadura
    etiqueta: 'Levadura y enzimas'
    pregunta: 'Cuanta levadura y enzimas, con su unidad? (ej. "20 g")'
    obligatorio: true
    tipo: numero
    unidad: g
    pedir_unidad: true
    clave: '(?:levadura|enzimas?)'
    insumo: levadura_sku
    rango: [1, 2000]
    patrones:
      - '(\d+(?:[.,]\d+)?)\s*(?:kilos?|kgs?|kilogramos?|g|gr|grs|gramos?)\s+(?:de\s+)?(?:levadura|enzimas?)'
      - '(?:levadura|enzimas?)(?:\s+y\s+enzimas?)?\s*(?:de|:)?\s*(\d+(?:[.,]\d+)?)'
  - nombre: brix_final
    etiqueta: 'Brix final'
    pregunta: 'Cuanto Brix final (despues del aditivo 1)?'
    obligatorio: true
    tipo: numero
    unidad: Brix
    rango: [0, 40]
    patrones:
      - 'brix\s+final\s*(?:de|en|a|:)?\s*(\d+(?:[.,]\d+)?)'
      - 'final\s+(?:en|a|de)\s+(\d+(?:[.,]\d+)?)\s*(?:de\s+)?brix'
  # 2026-11-10 (Norman: "que el bot meta inicio de fermentacion, fin de
  # fermentacion, horas de fermentacion que sea opcional"). Opcionales: al abrir
  # el lote casi nunca ha terminado. El fin va al servidor como dias desde el
  # inicio (la fecha de fin la calcula `lib/bot-lotes.ts`, como siempre).
  - nombre: fin_fermentacion
    etiqueta: 'Fin de fermentacion'
    pregunta: '(opcional) Cuando termino la fermentacion? (hoy, ayer, 8/11)'
    obligatorio: false
    tipo: fecha
    patrones:
      - '(?:\b(?:termin\w*|acab\w*|paro|finaliz\w*)\s+(?:de\s+)?(?:la\s+)?fermenta\w*|\bfin\s+de\s+(?:la\s+)?fermenta\w*|\bfermento\s+hasta)[^.,;0-9]{0,15}?((?:el\s+)?\d{1,2}\s+de\s+[a-z]+|\d{1,2}/\d{1,2}(?:/\d{2,4})?|\d{4}-\d{1,2}-\d{1,2}|antier|antes\s+de\s+ayer|ayer|hoy|hace\s+\d{1,2}\s+dias?)'
  - nombre: horas_fermentacion
    etiqueta: 'Horas de fermentacion'
    pregunta: '(opcional) Cuantas horas fermento?'
    obligatorio: false
    tipo: numero
    unidad: horas
    rango: [1, 744]
    patrones:
      - '(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|horas?)\b'

# Ronda 5 (Norman 2026-10-19): se usa guajillo, guajon, o una mezcla de los
# dos. Cada tipo es un renglon de insumo con su SKU. "30 kg guajillo y 10 kg
# guajon" -> dos renglones. Un chile que no es ninguno de los dos: se avisa y se
# pregunta (una vez).
chiles:
  # 2026-11-10 (D-004): todo el chile se carga a chile-guajillo, que es el que
  # v_lote_rendimiento suma como kg_chile (el ERP ya lo captura como «Chile»).
  conocidos:
    guajillo: chile-guajillo
    guajon: chile-guajillo
  # Cada par (kilos, tipo) de una mezcla. Grupo 1: kilos; grupo 2: tipo.
  mezcla: '(\d+(?:[.,]\d+)?)\s*(?:kilos?|kgs?|kilogramos?)?\s*(?:de\s+)?(?:chile\s+)?(guajillo|guajon)\b'

# Fuera de la plantilla numerada, pero se reconocen si vienen dichos.
extras:
  - nombre: temperatura_dicha
    tipo: a_notas
    # Ronda 5 (Norman 2026-10-19): la gente NO dicta temperatura; sale sola de
    # Open-Meteo. Si la mencionan, el tramo va a notas TAL CUAL y sus numeros
    # no se leen como kilos, Brix ni garrafas. `primero`: se lee antes que los
    # campos. Lo usan la plantilla y las etapas (`lote_ciclo.temperatura_dicha`).
    primero: true
    patrones:
      - '\b(?:temperatura|cuarto|ambiente|termometro)\b[^0-9]{0,30}?(-?\d+(?:[.,]\d+)?)\s*(?:grados?|c)\b'
      - '(-?\d+(?:[.,]\d+)?)\s*grados?\s+(?:en\s+el\s+|de\s+)?(?:cuarto|ambiente)\b'
    nota: 'dijeron "{t}" (la temperatura no se guarda desde el chat: sale de Open-Meteo)'
  - nombre: codigo_lote
    tipo: codigo
    patrones:
      - '\b(l-?\d{1,2}-\d{1,2}\.\d{1,3}|l-?\d{3,5})\b'
  - nombre: grados_ambiguos
    tipo: a_notas
    # "a 24 grados" puede ser temperatura o alcohol: NO se adivina, va a notas.
    patrones:
      - '\ba\s+(\d+(?:[.,]\d+)?)\s*grados?\b'
    nota: '{0} grados (no dijeron si es temperatura o alcohol)'
  - nombre: brix_ambiguo
    tipo: a_notas
    # Ronda 3: "brix 12" sin decir si es del chile o el final se perdia callado
    # (ni campo ni notas). NO se adivina: va a notas y se ve en el resumen.
    patrones:
      - '\bbrix\s*(?:de\s+|en\s+|:\s*)?(\d+(?:[.,]\d+)?)'
    nota: 'Brix {0} (no dijeron si es del chile o el final)'
    # Si lo que se pregunto deja UN solo Brix posible, es ese.
    campo_si_unico: [brix_chile, brix_final]

# "No se", "luego": el campo preguntado se deja vacio y queda anotado.
omitir:
  - '\bno\s+se\b'
  - '\b(te\s+digo\s+)?luego\b'
  - '\bdespues\b'
  - '\bahorita\s+no\b'
  - '\bal\s+rato\b'
  - '\bno\s+tengo\s+el\s+dato\b'

# Palabras que no cuentan como "algo mas que anotar". Lo que sobra del mensaje,
# quitando lo reconocido y esto, si son 2 o mas palabras, va a notas.
relleno: >-
  y e o a al de del la el los las le lo un una uno con por para que se es son
  ya hoy ahora ahorita van va ser fue fueron va a ser le entraron entraron entro
  metimos meti metio echamos eche le pusimos pusimos ponle lote nuevo otro
  empezamos arrancamos arranque arranco iniciamos abrimos abro chile chiles
  empecemos empezemos iniciemos arranquemos
  fermentacion fermenta fermentar fermentando queda quedan se queda dura durar
  tambos tambo tanques tanque litros grados kilos kg dias dia como unos unas
  mas menos pues bueno ok oye mira si no tambien plantilla dame manda pasame
  cuantos cuantas cuanto brix final aditivo tipo dio en
  gramos gramo gr grs levadura enzimas
  fecha inicio empezo empezamos el termino acabo fin horas hora hrs

# ════════════════════════════════════════════════════════════════════════════
# EL CICLO DEL LOTE (bot/lote_ciclo.py). Corre colgado del latido de 15 min.
# Cada recordatorio sale UNA vez: el reclamo vive en la base
# (`lote_recordatorios`), asi que un reinicio del bot no lo repite.
# ════════════════════════════════════════════════════════════════════════════

# Fresnillo, Zac. (geocoding de Open-Meteo, 2026-10-19: 23.1749, -102.86785,
# 2192 m). La temperatura es la del AIRE DE FUERA: proxy SIN ANCLAR de la
# temperatura del mosto. No se ha comparado nunca contra un termometro en el
# cuarto de fermentacion.
ubicacion:
  nombre: 'Fresnillo, Zac.'
  latitud: 23.1749
  longitud: -102.86785
  zona: 'America/Mexico_City'
  # Mexico no cambia de horario desde 2022: UTC-6 fijo (sin depender de tzdata).
  utc_offset_horas: -6

temperatura:
  fuente: 'open-meteo exterior'
  url: 'https://api.open-meteo.com/v1/forecast'
  timeout_segundos: 20
  # Ronda 5 (decision de Norman, 2026-10-19): la gente NO dicta temperatura.
  # Sale SOLO de Open-Meteo. Si alguien la menciona, va a notas (extra
  # `temperatura_dicha`), nunca a `temperatura_diaria`.

# Ronda 5 (B, decision de Norman 2026-10-19): la produccion de un lote termina
# en la DESTILACION. El ENVASADO de botellas es diario e independiente del lote
# y por ahora NO se liga a ninguno. Un mensaje que casa con esto nunca abre ni
# pide un lote: ni la plantilla ni una etapa lo toman (sigue al modelo y de ahi
# al envasado diario del servidor, sin lote). Los `disparadores` de etapa
# anclados al inicio no lo miran ("ya destilamos..., salieron 2 botellones").
envasado_diario:
  - '\b(envas|embotell)\w*'
  - '\bbotellas?\b'
  - '\bsalieron\s+\d+\s+(botellas?\s+)?de\s+\d{2,4}\b'
  - '\b\d+\s+(botellas?\s+)?de\s+(50|200|250|375|500|700|750|1000)\b(?!\s*(kg|kilos?|%|grados?))'

ciclo:
  # 2026-11-13 (Cris): el aditivo 2 es insumo, no etapa: ya no se recuerda.
  # "Ya toca destilar" sale el dia aditivo_2_dia + reposo_dias desde la produccion.
  aditivo_2_dia: 3          # D+3 despues de la produccion (era cuando va el aditivo 2)
  reposo_dias: 3            # dias de reposo despues de ese dia: "ya toca destilar"
  muestra_horas: 24         # sin "Ya la guarde" en este tiempo: UN segundo aviso y ya
  hora_recordatorios: 8     # no se recuerda antes de esta hora local
  intentos_recordatorio: 3  # reclamos de un recordatorio que no salio a nadie (ronda 2)
  ventana_dias: 45          # lotes mas viejos que esto ya no se revisan

# Rangos que AVISAN (no bloquean) en las etapas.
# `disparadores`: frases que abren la captura de la etapa sin modelo (al inicio
# del mensaje). Sin codigo de lote, el bot pregunta "De cual lote?". Lo normal
# es entrar por el boton del recordatorio.
etapas:
  # Ronda 3 (R2-B), corregida en ronda 4: si el mensaje casa con alguno de
  # estos, los `disparadores_con_codigo` (codigo L- en medio) NO lo toman: es un
  # envasado F0 o una pregunta, y sigue al modelo (camino F0/D81). NO aplica a
  # los `disparadores` anclados al inicio, ni si el mensaje trae `datos_de_etapa`.
  # Sin "que" ni "como" al inicio: "que crees, ya destilamos..." no es pregunta.
  # Muletillas que se quitan antes de mirar los disparadores (ronda 4).
  muletillas:
    - '^\W*oye\b\W*'
    - '\W*\bque\s+crees\b\W*'
    - '\W*\bsabes\s+que\b\W*'
    - '\W*\bcomo\s+quedamos\b\W*'
  datos_de_etapa: '\bgarraf\w*|\d+(?:[.,]\d+)?\s*(?:kg|kgs|kilos?|kilogramos?|g|gr|grs|gramos?|l|lt|lts|litros?)\b|%|\bpor\s*ciento\b'
  # Ronda 5: la parte de envasados salio a `envasado_diario` (arriba).
  no_abren_etapa:
    - '\?'
    - '^\W*(oye\W+)?(cuant[oa]s?|cual(es)?|cuando|donde|quien(es)?|sabes|dime|me\s+dices)\b'
  # 2026-11-13 (Cris): el aditivo 2 es insumo. Estos disparadores ya NO abren
  # etapa: solo ganan primero para que el mensaje no abra otra etapa (destilacion)
  # y siga al modelo como insumo de un lote existente (lote_ciclo.ETAPAS_RETIRADAS).
  aditivo_2:
    disparadores:
      - '^\W*(registra\w*\s+|ya\s+|hoy\s+)?(el\s+)?aditivo\s*(2|dos)\b'
    # En cualquier parte del mensaje, SOLO si el mismo mensaje trae un codigo L-.
    disparadores_con_codigo:
      - '\baditivo\s*(2|dos)\b'
    # En KILOS (es fisico) aunque el catalogo lleve el aditivo en GRAMOS: lo
    # dicho en g se compara en kg. Solo AVISA.
    rango_kg: [0.01, 200]
  destilacion:
    disparadores:
      - '^\W*(registra\w*\s+(la\s+)?|ya\s+|hoy\s+)?destil(amos|e|o|ando|acion)\b'
    disparadores_con_codigo:
      # Ronda 6: tambien 'terminamos/acabamos de destilar el L-..', 'ya quedo destilado el L-..'.
      - '\bdestil(amos|e|o|ando|acion|aron|aste|ar|ado|ada)\b'
    rango_litros: [0.1, 60]
    rango_peso_kg: [0.1, 60]
    rango_alcohol: [0, 80]
    tope_garrafas: 50
  # Fase 7B (2026-11-07): el fin de la fermentacion. Escribe la cabecera del lote
  # (fecha_fin_fermentacion y horas), como la web.
  fin_fermentacion:
    disparadores:
      - '^\W*(ya\s+|hoy\s+|ayer\s+)?(termino|acabo|se\s+acabo|paro|se\s+paro|finalizo)\s+(la\s+)?fermentacion\b'
      - '^\W*(registra\w*\s+(el\s+)?)?fin\s+de\s+(la\s+)?fermentacion\b'
      - '^\W*(ya\s+)?(dejo\s+de|termino\s+de|acabo\s+de)\s+fermentar\b'
    disparadores_con_codigo:
      - '\b(termino|acabo|paro|finalizo)\s+(la\s+)?fermentacion\b'
      - '\bfin\s+de\s+(la\s+)?fermentacion\b'
      - '\b(dejo\s+de|termino\s+de|acabo\s+de)\s+fermentar\b'

textos:
  # 2026-11-13 (Cris): el aditivo 2 es un insumo del inventario, no una etapa del lote.
  aditivo_2_no_es_etapa: 'El aditivo 2 ya no es una etapa del lote: es un insumo como cualquier otro. Dictamelo como insumo, por ejemplo: "agregale 1500 g de aditivo 2 al lote {codigo}". Con este boton no anote nada.'
  aditivo_2_pregunta: 'Lote {codigo} - aditivo 2. Cuanto aditivo 2, con su unidad? (ej. "1.5 kg" o "1500 g")'
  aditivo_2_unidad: 'Lote {codigo} - aditivo 2: {cantidad} gramos o {cantidad} kilos? Contesta "gramos" o "kilos".'
  fin_fermentacion_pregunta: 'Lote {codigo} - fin de fermentacion. Cuando termino (hoy, ayer, hace 2 dias) y, si las llevaron, cuantas horas fermento?'
  destilar_recordatorio: 'Lote {codigo}: ya paso el reposo (dia {dias} desde la produccion). Ya toca destilar.'
  destilacion_pregunta: "Lote {codigo} - destilacion. Cuantas garrafas salieron, y de cada una los litros, el peso (kg) y el % de alcohol? Si quieres, una nota entre parentesis.\nEjemplo: 3 garrafas: 20 L 18.5 kg 52%, 19 L 17 kg 48% (turbia), 11 L 10 kg 30%"
  muestra: 'Guarda una muestra del lote {codigo}.'
  muestra_2: 'Recordatorio (ultimo): guarda una muestra del lote {codigo}.'
